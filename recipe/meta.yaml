{% set name = "libass" %}
{% set version = "0.17.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/releases/download/{{ version }}/{{ name }}-{{ version }}.tar.xz
  sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

build:
  number: 0
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage('libass', max_pin='x.x.x') }}
  ignore_run_exports:
    - expat

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - make
    - autoconf
    - automake
    - pkg-config
    - libtool
    - nasm
  host:
    - freetype {{ freetype }}
    - zlib {{ zlib }}
    - fribidi {{ fribidi }}
    - fontconfig {{ fontconfig }}
    - expat {{ expat }}
    - libiconv {{ libiconv }}
    - harfbuzz {{ harfbuzz }}

test:
  commands: test -f ${PREFIX}/lib/libass${SHLIB_EXT}

about:
  home: https://github.com/libass/libass
  license: ISC
  license_family: OTHER
  license_file: COPYING
  summary: A portable subtitle renderer for the ASS/SSA (Advanced Substation Alpha/Substation Alpha) subtitle format.
  description: A portable subtitle renderer for the ASS/SSA (Advanced Substation Alpha/Substation Alpha) subtitle format.
  dev_url: https://github.com/libass/libass
  doc_url: https://github.com/libass/libass

extra:
  recipe-maintainers:
    - Tobias-Fischer
    - scopatz
